node_pool_replicas_count: 3

listeners:
  plain:
    host: kafka-debezium-cluster-kafka-bootstrap.default.svc
    port: 9092
    type: internal
    tls: false
  tls:
    host: kafka-debezium-cluster-kafka-bootstrap.default.svc
    port: 9093
    type: internal
    tls: true
    authentication:
      type: tls
  external:
    host: kafka-debezium-cluster-kafka-bootstrap.default.svc
    port: 9094
    type: nodeport
    tls: false

tablesList: >
  public.polygons,
  public.shops,
  public.couriers,
  public.pickers,
  public.clients,
  public.products,
  public.orders,
  public.order_products,
  public.work_shifts

topic2tableMap: >
  postgres.delivery.public.polygons=postgres_delivery_public_polygons,
  postgres.delivery.public.shops=postgres_delivery_public_shops,
  postgres.delivery.public.couriers=postgres_delivery_public_couriers,
  postgres.delivery.public.pickers=postgres_delivery_public_pickers,
  postgres.delivery.public.clients=postgres_delivery_public_clients,
  postgres.delivery.public.products=postgres_delivery_public_products,
  postgres.delivery.public.orders=postgres_delivery_public_orders,
  postgres.delivery.public.order_products=postgres_delivery_public_order_products,
  postgres.delivery.public.work_shifts=postgres_delivery_public_work_shifts

config:
  # разобраться с партициями и репликами
  topic.creation.enable: true
  topic.creation.default.replication.factor: 2
  topic.creation.default.partitions: 2
  offsets.topic.replication.factor: 3
  transaction.state.log.replication.factor: 3
  transaction.state.log.min.isr: 2
  default.replication.factor: 3
  min.insync.replicas: 2