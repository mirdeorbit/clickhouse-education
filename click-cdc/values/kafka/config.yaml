node_pool_replicas_count: 3

listeners:
  plain:
    host: kafka-debezium-cluster-kafka-bootstrap.default.svc
    port: 9092
    type: internal
    tls: false
  tls:
    host: kafka-debezium-cluster-kafka-bootstrap.default.svc
    port: 9093
    type: internal
    tls: true
    authentication:
      type: tls
  external:
    host: kafka-debezium-cluster-kafka-bootstrap.default.svc
    port: 9094
    type: nodeport
    tls: false

config:
  offsets.topic.replication.factor: 3
  transaction.state.log.replication.factor: 3
  transaction.state.log.min.isr: 2
  default.replication.factor: 3
  min.insync.replicas: 2