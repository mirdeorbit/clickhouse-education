apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-click-cdc-clickhouse-shard0-0-pv
  labels:
    type: local
spec:
  storageClassName: clickhouse-local
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/minikube/clickhouse/shard0"

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-click-cdc-clickhouse-shard0-1-pv
  labels:
    type: local
spec:
  storageClassName: clickhouse-local
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/minikube/clickhouse/shard1"


---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-click-cdc-clickhouse-keeper-0-pv
  labels:
    type: local
spec:
  storageClassName: clickhouse-local-keeper
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/minikube/clickhouse/keeper"

