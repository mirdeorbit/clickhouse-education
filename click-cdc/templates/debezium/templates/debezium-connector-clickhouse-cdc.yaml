# connector for listening changes from kafka postgresql topics and write it to clickhouse for 
# operational data store (ODS)
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: debezium-connector-clickhouse-cdc
  labels:
    strimzi.io/cluster: debezium-connect-cluster
spec:
  class: com.clickhouse.kafka.connect.ClickHouseSinkConnector
  tasksMax: 1
  config:
    hostname: click-cdc-{{ .Values.clickhouse.fullNameOverride }}-headless.default.svc
    schemas.enable: false
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    topics.regex: "^postgres.*"
    username: {{ .Values.authCredentials.username }}
    password: {{ .Values.authCredentials.password }}
    port: {{ .Values.clickhouse.containerPorts.http }}
    database: {{ .Values.cdcDatabase.name }}
    topic2TableMap: {{ .Values.topic2tableMap.cdc }}
    transforms: flatten
    transforms.flatten.type: org.apache.kafka.connect.transforms.Flatten$Value
    transforms.flatten.delimiter: "."